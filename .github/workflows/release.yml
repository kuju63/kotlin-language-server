name: Release

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for semantic versioning

      - name: Calculate semantic version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: false
          # Prefix for version tags
          tag_prefix: v
          # Custom release rules
          custom_release_rules: feat:minor:Features,fix:patch:Bug Fixes,perf:patch:Performance Improvements,docs:false:Documentation,style:false:Styles,refactor:false:Code Refactoring,test:false:Tests,chore:false:Chores,ci:false:CI/CD

      - name: Check if new version should be released
        id: should_release
        run: |
          # Compare new tag with previous tag to determine if a release is needed
          # This is more reliable than checking the latest commit message directly,
          # which could be a merge commit that doesn't match conventional commit patterns
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          PREVIOUS_TAG="${{ steps.version.outputs.previous_tag }}"

          # Only attempt a release when a non-empty new tag was calculated
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREVIOUS_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "✅ New version detected: $NEW_TAG (previous: ${PREVIOUS_TAG:-none})"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            if [ -z "$NEW_TAG" ]; then
              echo "ℹ️ No new version to release (no semantic version tag calculated)"
            else
              echo "ℹ️ No new version to release (commit type does not trigger version bump)"
            fi
          fi

      - name: Validate Gradle Wrapper
        if: steps.should_release.outputs.should_release == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        if: steps.should_release.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.should_release.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Fat JAR with version
        if: steps.should_release.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          echo "Building version: $VERSION"
          gradle clean build shadowJar --no-daemon --stacktrace

      - name: Create and push Git tag
        if: steps.should_release.outputs.should_release == 'true'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: false
          custom_tag: ${{ steps.version.outputs.new_version }}
          tag_prefix: v

      - name: Generate changelog
        if: steps.should_release.outputs.should_release == 'true'
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.1.0
        with:
          configuration: .github/workflows/release-changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.should_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          body: |
            # Kotlin Language Server v${{ steps.version.outputs.new_version }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Installation

            Download the JAR file and run:
            ```bash
            java -Xmx2G -jar kotlin-language-server-${{ steps.version.outputs.new_version }}.jar
            ```

            ## 📋 Requirements

            - JDK 21 or higher

            ---

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          files: |
            build/libs/kotlin-language-server-*.jar
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}